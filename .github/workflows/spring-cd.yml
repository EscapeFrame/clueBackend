name: Spring CD

on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Spring Project
        run: ./gradlew clean build -x test

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy JAR to EC2
        run: |
          scp -o StrictHostKeyChecking=no build/libs/*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/app.jar

      - name: Restart Spring App Container on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            cd /home/${{ secrets.EC2_USER }}/app

            # 기존 app.jar이 디렉토리일 경우 삭제
            if [ -d "app.jar" ]; then
              rm -rf app.jar
            fi

            # spring 서비스 컨테이너만 다시 빌드하고 재시작
            docker compose up -d --build --force-recreate paletto
          EOF
