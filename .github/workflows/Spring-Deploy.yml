name: Spring-Deploy.yml
on:
  push:
    branches: [main]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: application.properties 파일 설정
        run: |
          mkdir -p src/main/resources
          mkdir -p src/test/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.properties
          echo "${{ secrets.TEST_APPLICATION_PROPERTIES }}" > ./src/test/resources/application.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build

      - name: 빌드된 파일 이름 변경하기
        run: mv ./build/libs/*SNAPSHOT.jar ./clue.jar

      - name: SCP로 EC2에 빌드된 파일 전송하기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEPLOY_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_DEPLOY_SSH_KEY }}
          source: clue.jar
          target: /home/ubuntu/clue


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEPLOY_HOST }}
          username: ${{ secrets.EC2_DEPLOY_USER }}
          key: ${{ secrets.EC2_DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/clue
            echo "현재 실행 중인 애플리케이션을 중지합니다..."
            pkill -f clue.jar || true
            sleep 5

            echo "새 애플리케이션을 시작합니다..."
            nohup java -Dspring.profiles.active=dep -jar clue.jar > ./output.log 2>&1 &

            echo "애플리케이션 시작을 기다리는 중..."
            for i in {1..15}; do
              echo "Health check 시도 #$i..."
              if curl -s --fail http://localhost:8080/actuator/health; then
                echo "애플리케이션이 성공적으로 시작되었습니다!"
                exit 0
              fi
              sleep 5
            done

            echo "시간 내에 애플리케이션이 시작되지 않았습니다. 서버의 output.log 파일을 확인하세요."
            exit 1