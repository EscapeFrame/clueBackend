spring:
  application:
    name: CLUE-Backend

 #profile 설정
  profiles:
    active: dev

  datasource:
    url: ${POSTGRES_URI}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
      enabled: true

  jwt:
    secret: ${JWT_SECRET}

  neis:
    api:
      host: open.neis.go.kr/hub
      key: ${NEIS_API_KEY}
      atpt-code: C10
      school-code: 7150658

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
        provider:
          google:
            authorization-uri: ${GOOGLE_AUTHORIZATION_URI}
  mvc:
    static-path-pattern: /ui/**


upload:
  local:
    dir: ${UPLOAD_FILE_DIR}

cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY}
      secretKey: ${AWS_SECRET_KEY}
    s3:
      bucket : ${AWS_BUCKET_NAME}
    region:
      static: ap-northeast-2
    stack:
      auto: false

front:
  base-url: ${FRONT_BASE_URL}
app:
  base-url: ${APP_BASE_URL}
server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true

  address: 0.0.0.0
  port: 8080
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO

linksave:
  url: http://localhost:8081